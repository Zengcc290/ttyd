server {
    listen 0.0.0.0:7682;
    server_name _;

    access_log /var/log/nginx/webterm-access.log main;
    error_log /var/log/nginx/webterm-error.log warn;

    auth_basic "Private server terminal";
    auth_basic_user_file /www/conf.d/.webterm.htpasswd;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    location = / {
        root /www/webterm-dashboard;
        try_files /index.html =404;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self' ws: wss:; img-src 'self' data:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
    }

    location = /terminal-touch-scroll.js {
        alias /www/webterm-dashboard/terminal-touch-scroll.js;
        add_header Cache-Control "no-store" always;
    }

    location = /terminal-controls.js {
        alias /www/webterm-dashboard/terminal-controls.js;
        add_header Cache-Control "no-store" always;
    }

    location = /terminal-keyboard.js {
        alias /www/webterm-dashboard/terminal-keyboard.js;
        add_header Cache-Control "no-store" always;
    }

    location /api/ {
        client_max_body_size 8k;
        proxy_pass http://127.0.0.1:7684;
        proxy_http_version 1.1;
        proxy_set_header Authorization "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30;
        proxy_buffering off;
    }

    location = /_webterm-lock-check {
        internal;
        proxy_pass http://127.0.0.1:7684/internal/terminal-access;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Webterm-Original-URI $request_uri;
    }

    # WebSocket upgrade from browsers often omits Basic Auth even when the page was authenticated.
    # The lock token is independently validated for every websocket handshake.
    location = /terminal/ws {
        auth_basic off;
        auth_request /_webterm-lock-check;
        proxy_pass http://127.0.0.1:7681/terminal/ws;
        proxy_http_version 1.1;
        proxy_set_header Authorization "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        proxy_buffering off;
    }

    location = /terminal {
        return 308 /terminal/;
    }

    location = /terminal/ {
        auth_request /_webterm-lock-check;
        proxy_pass http://127.0.0.1:7681;
        proxy_http_version 1.1;
        proxy_set_header Authorization "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Encoding "";
        proxy_buffering off;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        sub_filter_once on;
        sub_filter '</head>' '<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><script src="/terminal-touch-scroll.js"></script><script src="/terminal-controls.js"></script><script src="/terminal-keyboard.js"></script></head>';
    }

    location /terminal/ {
        proxy_pass http://127.0.0.1:7681;
        proxy_http_version 1.1;
        proxy_set_header Authorization "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Accept-Encoding "";
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        proxy_buffering off;
    }

    location / {
        return 404;
    }
}
