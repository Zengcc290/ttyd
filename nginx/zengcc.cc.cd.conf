server {
    listen 80;
    server_name zengcc.cc.cd;

    access_log /www/sites/webterm-zengcc/log/access.log main;
    error_log /www/sites/webterm-zengcc/log/error.log warn;

    auth_basic "Private server terminal";
    auth_basic_user_file /www/conf.d/.webterm.htpasswd;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    location = / {
        root /www/webterm-dashboard;
        try_files /index.html =404;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self' ws: wss:; img-src 'self' data:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
    }

    location = /terminal-touch-scroll.js {
        alias /www/webterm-dashboard/terminal-touch-scroll.js;
        add_header Cache-Control "no-store" always;
    }

    location /api/ {
        client_max_body_size 8k;
        proxy_pass http://127.0.0.1:7684;
        proxy_http_version 1.1;
        proxy_set_header Authorization "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30;
        proxy_buffering off;
    }

    location = /terminal/ws {
        auth_basic off;
        proxy_pass http://127.0.0.1:7681/terminal/ws;
        proxy_http_version 1.1;
        proxy_set_header Authorization "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        proxy_buffering off;
    }

    location = /terminal {
        return 308 /terminal/;
    }

    location /terminal/ {
        proxy_pass http://127.0.0.1:7681;
        proxy_http_version 1.1;
        proxy_set_header Authorization "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Accept-Encoding "";
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        proxy_buffering off;
        sub_filter_types text/html;
        sub_filter_once on;
        sub_filter '</head>' '<script src="/terminal-touch-scroll.js"></script></head>';
    }
}
