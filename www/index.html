<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>服务器终端</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #101214;
      --panel: #171a1d;
      --panel-2: #202428;
      --line: #343a40;
      --text: #f1f3f5;
      --muted: #9ca3aa;
      --green: #44c78a;
      --red: #fb7185;
      --yellow: #fbbf24;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background: var(--bg);
    }
    .shell { width: min(1100px, calc(100% - 32px)); margin: 0 auto; padding: 48px 0 72px; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 24px; margin-bottom: 28px; }
    .brand { display: flex; align-items: center; gap: 14px; }
    .logo { width: 46px; height: 46px; display: grid; place-items: center; border: 1px solid #3c4641; border-radius: 6px; background: #1c211f; box-shadow: 0 16px 40px rgba(0,0,0,.3); font: 700 22px/1 ui-monospace, monospace; color: var(--green); }
    h1 { margin: 0; font-size: 30px; letter-spacing: 0; }
    .subtitle { margin: 6px 0 0; color: var(--muted); font-size: 14px; }
    button { font: inherit; }
    .primary { border: 0; border-radius: 6px; padding: 12px 18px; color: #04150f; background: var(--green); font-weight: 750; cursor: pointer; box-shadow: 0 10px 30px rgba(68,199,138,.16); }
    .primary:hover { filter: brightness(1.08); }
    .summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 20px; }
    .metric { padding: 17px 18px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; }
    .metric strong { display: block; font-size: 23px; margin-bottom: 3px; }
    .metric span { color: var(--muted); font-size: 13px; }
    .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 26px 0 12px; }
    h2 { margin: 0; font-size: 17px; }
    .hint { color: var(--muted); font-size: 13px; }
    .sessions { display: grid; gap: 12px; }
    .card { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 20px; padding: 18px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); box-shadow: 0 14px 40px rgba(0,0,0,.18); }
    .title-row { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .status { width: 9px; height: 9px; border-radius: 50%; background: #526071; flex: none; }
    .status.running { background: var(--green); box-shadow: 0 0 0 5px rgba(54,211,153,.1); }
    .session-name { margin: 0; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .name-editor { display: flex; align-items: center; gap: 6px; min-width: 0; flex: 1; }
    .name-editor input { min-width: 0; width: min(360px, 100%); border: 1px solid var(--green); border-radius: 6px; padding: 7px 9px; color: var(--text); background: var(--panel-2); font: inherit; }
    .icon-btn { width: 30px; height: 30px; padding: 0; display: inline-grid; place-items: center; color: var(--muted); line-height: 1; flex: none; }
    .icon-btn:hover { color: var(--text); }
    .meta { display: flex; flex-wrap: wrap; gap: 8px 16px; margin-top: 8px; color: var(--muted); font-size: 12px; }
    .actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; }
    .btn { border: 1px solid var(--line); border-radius: 6px; padding: 9px 12px; color: var(--text); background: var(--panel-2); cursor: pointer; }
    .btn:hover { border-color: #58615c; background: #272c30; }
    .btn.open { color: #061610; border-color: transparent; background: var(--green); font-weight: 700; }
    .btn.danger { color: #fecdd3; }
    .btn.locked { color: #ffe8a3; border-color: #8a6d1f; }
    .badge-lock { display:inline-flex; align-items:center; gap:6px; padding:2px 8px; border-radius:999px; border:1px solid #8a6d1f; color:#ffe8a3; font-size:11px; }
    .modal-mask { position:fixed; inset:0; z-index:50; display:none; align-items:center; justify-content:center; background:rgba(0,0,0,.45); padding:18px; }
    .modal-mask.show { display:flex; }
    .modal { width:min(440px,100%); background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:18px; box-shadow:0 24px 70px rgba(0,0,0,.45); }
    .modal h3 { margin:0 0 8px; font-size:16px; }
    .modal p { margin:0 0 12px; color:var(--muted); font-size:13px; line-height:1.5; }
    .modal input { width:100%; border-radius:8px; border:1px solid var(--line); background:var(--panel-2); color:var(--text); padding:11px 12px; font:inherit; }
    .modal .row { display:flex; gap:8px; justify-content:flex-end; margin-top:14px; }
    .empty { padding: 48px 22px; border: 1px dashed #3a4146; border-radius: 6px; text-align: center; color: var(--muted); background: var(--panel); }
    .empty strong { display: block; color: var(--text); font-size: 17px; margin-bottom: 8px; }
    .toast { position: fixed; right: 20px; bottom: 20px; max-width: min(380px, calc(100% - 40px)); padding: 13px 16px; border-radius: 6px; background: #202428; border: 1px solid #485057; box-shadow: 0 18px 50px rgba(0,0,0,.4); opacity: 0; transform: translateY(12px); pointer-events: none; transition: .2s ease; }
    .toast.show { opacity: 1; transform: translateY(0); }
    .toast.error { border-color: #7f3040; color: #fecdd3; }
    @media (max-width: 760px) {
      .shell { width: min(100% - 22px, 1100px); padding-top: 26px; }
      h1 { font-size: 24px; }
      header { align-items: flex-start; flex-direction: column; }
      .primary { width: 100%; }
      .summary { grid-template-columns: 1fr; }
      .card { grid-template-columns: 1fr; }
      .actions { justify-content: flex-start; }
      .btn { flex: 1; }
      .title-row .icon-btn { flex: none; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div class="brand">
        <div class="logo">&gt;_</div>
        <div>
          <h1>服务器终端</h1>
          <p class="subtitle">webterm@armbian</p>
        </div>
      </div>
      <button class="primary" id="newSession">＋ 新建独立终端</button>
    </header>

    <section class="summary">
      <div class="metric"><strong id="totalCount">—</strong><span>终端总数</span></div>
      <div class="metric"><strong id="runningCount">—</strong><span>正在运行</span></div>
      <div class="metric"><strong id="clientCount">—</strong><span>已连接窗口</span></div>
    </section>

    <div class="toolbar">
      <h2>我的终端</h2>
      <span class="hint" id="lastRefresh">正在连接…</span>
    </div>
    <section class="sessions" id="sessions"></section>

  </main>
  <div class="modal-mask" id="forceUnlockMask">
    <div class="modal">
      <h3>终端已锁定</h3>
      <p id="forceUnlockMsg">该终端正在其他页面使用。可关闭原页面后重试，或输入强制解锁密文后继续进入。</p>
      <input id="forceUnlockSecret" type="password" placeholder="强制解锁密文" autocomplete="off">
      <div class="row">
        <button class="btn" type="button" id="forceUnlockCancel">取消</button>
        <button class="btn open" type="button" id="forceUnlockConfirm">强制解锁并进入</button>
      </div>
    </div>
  </div>
  <div class="toast" id="toast"></div>

  <script>
    const sessionsEl = document.getElementById('sessions');
    const toastEl = document.getElementById('toast');
    let sessions = [];
    let editingSessionId = null;
    const renamingSessions = new Set();

    function toast(message, error = false) {
      toastEl.textContent = message;
      toastEl.className = `toast show${error ? ' error' : ''}`;
      clearTimeout(toast.timer);
      toast.timer = setTimeout(() => toastEl.className = 'toast', 3200);
    }

    async function api(path, options = {}) {
      const response = await fetch(path, {
        ...options,
        cache: 'no-store',
        headers: {
          'Content-Type': 'application/json',
          'X-Webterm-Request': '1',
          ...(options.headers || {})
        }
      });
      const body = await response.json().catch(() => ({}));
      if (!response.ok) {
        const err = new Error(body.error || `请求失败 (${response.status})`);
        err.status = response.status;
        err.body = body;
        throw err;
      }
      return body;
    }

    function formatTime(timestamp) {
      return new Intl.DateTimeFormat('zh-CN', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' }).format(new Date(timestamp * 1000));
    }

    function relativeTime(timestamp) {
      const seconds = Math.max(0, Math.floor(Date.now() / 1000 - timestamp));
      if (seconds < 60) return '刚刚';
      if (seconds < 3600) return `${Math.floor(seconds / 60)} 分钟前`;
      if (seconds < 86400) return `${Math.floor(seconds / 3600)} 小时前`;
      return `${Math.floor(seconds / 86400)} 天前`;
    }

    function terminalUrl(id, lockToken) {
      const url = new URL('/terminal/', location.origin);
      url.searchParams.append('arg', id);
      url.searchParams.set('lock_token', lockToken);
      return url.toString();
    }

    let pendingOpen = null; // {id, targetWindow}

    function openTerminalTarget() {
      const targetWindow = window.open('', '_blank');
      if (targetWindow) {
        try { targetWindow.opener = null; } catch (_) {}
      }
      return targetWindow;
    }

    function openSession(id, lockToken, targetWindow) {
      const destination = terminalUrl(id, lockToken);
      if (!targetWindow || targetWindow.closed) {
        toast('浏览器阻止了新终端标签页，请允许此站点打开新标签页后重试。', true);
        return false;
      }
      targetWindow.location.replace(destination);
      return true;
    }

    function showForceUnlock(id, targetWindow, lockInfo = {}) {
      pendingOpen = { id, targetWindow };
      const owner = lockInfo.owner ? `占用方：${lockInfo.owner}` : '占用方：未知';
      document.getElementById('forceUnlockMsg').textContent =
        `该终端已在其他页面打开并加锁。${owner}。可关闭原页面后重试，或输入强制解锁密文后继续进入。`;
      document.getElementById('forceUnlockSecret').value = '';
      document.getElementById('forceUnlockMask').classList.add('show');
      document.getElementById('forceUnlockSecret').focus();
    }

    function hideForceUnlock() {
      document.getElementById('forceUnlockMask').classList.remove('show');
      pendingOpen = null;
    }

    function closeTarget(targetWindow) {
      if (targetWindow && targetWindow !== null) {
        try { targetWindow.close(); } catch (_) {}
      }
    }

    function updateSessionLockState(id, lockInfo = {}) {
      const session = sessions.find(item => item.id === id);
      if (!session) return;
      session.locked = Boolean(lockInfo.locked);
      session.lock = session.locked ? {
        locked: true,
        owner: String(lockInfo.owner || ''),
        locked_at: Number(lockInfo.locked_at || 0),
        heartbeat_at: Number(lockInfo.heartbeat_at || 0)
      } : { locked: false };
      render();
    }

    async function tryOpenSession(id, targetWindow = undefined) {
      try {
        // Acquire checks and claims the live lock atomically; dashboard state may be stale.
        const owner = `dashboard ${navigator.userAgent.slice(0, 32)}`;
        const acquired = await api(`/api/sessions/${id}/acquire`, {
          method: 'POST',
          body: JSON.stringify({ owner })
        });
        updateSessionLockState(id, acquired);
        if (openSession(id, acquired.token, targetWindow)) return true;
        try {
          await api(`/api/sessions/${id}/release`, {
            method: 'POST',
            body: JSON.stringify({ token: acquired.token })
          });
          updateSessionLockState(id, { locked: false });
        } catch (_) {}
        return false;
      } catch (error) {
        if (error.status === 409) {
          const lockInfo = { ...(error.body || {}), locked: true };
          updateSessionLockState(id, lockInfo);
          closeTarget(targetWindow);
          showForceUnlock(id, undefined, lockInfo);
          return false;
        }
        closeTarget(targetWindow);
        toast(`锁状态校验失败，已拒绝进入：${error.message}`, true);
        return false;
      }
    }

    function button(label, className, action) {
      const el = document.createElement('button');
      el.type = 'button';
      el.className = `btn ${className || ''}`;
      el.textContent = label;
      el.addEventListener('click', action);
      return el;
    }

    function beginRename(sessionId) {
      editingSessionId = sessionId;
      render();
      requestAnimationFrame(() => {
        const input = document.querySelector(`[data-rename-input="${sessionId}"]`);
        if (input) {
          input.focus();
          input.select();
        }
      });
    }

    function cancelRename() {
      editingSessionId = null;
      render();
    }

    async function saveRename(session, input, form) {
      const name = input.value.trim();
      if (!name) {
        toast('终端名称不能为空', true);
        input.focus();
        return;
      }
      if (renamingSessions.has(session.id)) return;
      if (name === session.name) {
        cancelRename();
        return;
      }

      renamingSessions.add(session.id);
      [...form.elements].forEach(element => { element.disabled = true; });
      try {
        const updated = await api(`/api/sessions/${session.id}/rename`, {
          method: 'POST',
          body: JSON.stringify({ name })
        });
        const index = sessions.findIndex(item => item.id === session.id);
        if (index !== -1) sessions[index] = updated;
        editingSessionId = null;
        render();
        toast('终端名称已更新');
      } catch (error) {
        toast(`名称更新失败：${error.message}`, true);
        input.focus();
        input.select();
      } finally {
        renamingSessions.delete(session.id);
        [...form.elements].forEach(element => { element.disabled = false; });
      }
    }

    function render() {
      document.getElementById('totalCount').textContent = sessions.length;
      document.getElementById('runningCount').textContent = sessions.filter(item => item.running).length;
      document.getElementById('clientCount').textContent = sessions.reduce((sum, item) => sum + item.clients, 0);
      sessionsEl.replaceChildren();

      if (!sessions.length) {
        const empty = document.createElement('div');
        empty.className = 'empty';
        empty.innerHTML = '<strong>暂无终端会话</strong>';
        sessionsEl.append(empty);
        return;
      }

      for (const session of sessions) {
        const card = document.createElement('article');
        card.className = 'card';
        const info = document.createElement('div');
        const titleRow = document.createElement('div');
        titleRow.className = 'title-row';
        const status = document.createElement('span');
        status.className = `status${session.running ? ' running' : ''}`;
        titleRow.append(status);
        if (editingSessionId === session.id) {
          const form = document.createElement('form');
          form.className = 'name-editor';
          form.addEventListener('submit', event => {
            event.preventDefault();
            saveRename(session, input, form);
          });
          const input = document.createElement('input');
          input.type = 'text';
          input.value = session.name;
          input.maxLength = 80;
          input.autocomplete = 'off';
          input.setAttribute('aria-label', '终端名称');
          input.dataset.renameInput = session.id;
          input.addEventListener('keydown', event => {
            if (event.key === 'Escape') {
              event.preventDefault();
              cancelRename();
            }
          });
          const saveButton = document.createElement('button');
          saveButton.type = 'submit';
          saveButton.className = 'btn icon-btn';
          saveButton.textContent = '✓';
          saveButton.title = '保存名称';
          saveButton.setAttribute('aria-label', '保存名称');
          const cancelButton = button('×', 'icon-btn', cancelRename);
          cancelButton.title = '取消编辑';
          cancelButton.setAttribute('aria-label', '取消编辑');
          form.append(input, saveButton, cancelButton);
          titleRow.append(form);
        } else {
          const title = document.createElement('h3');
          title.className = 'session-name';
          title.textContent = session.name;
          titleRow.append(title);
          const editButton = button('✎', 'icon-btn', () => beginRename(session.id));
          editButton.title = '编辑终端名称';
          editButton.setAttribute('aria-label', '编辑终端名称');
          titleRow.append(editButton);
        }
        const meta = document.createElement('div');
        meta.className = 'meta';
        meta.append(
          Object.assign(document.createElement('span'), { textContent: session.running ? '会话运行中' : '下次打开将新建 Shell' }),
          Object.assign(document.createElement('span'), { textContent: `${session.clients} 个窗口已连接` }),
          Object.assign(document.createElement('span'), { textContent: session.locked ? '占用中（已加锁）' : '未占用' }),
          Object.assign(document.createElement('span'), { textContent: `最后活动：${relativeTime(session.last_active)}` }),
          Object.assign(document.createElement('span'), { textContent: `创建：${formatTime(session.created)}` })
        );
        info.append(titleRow, meta);

        const actions = document.createElement('div');
        actions.className = 'actions';
        actions.append(
          button(session.locked ? '已锁定' : '继续', session.locked ? 'locked' : 'open', async () => {
            const targetWindow = openTerminalTarget();
            if (!targetWindow) {
              toast('浏览器阻止了新终端标签页，请允许此站点打开新标签页后重试。', true);
              return;
            }
            await tryOpenSession(session.id, targetWindow);
          }),
          button('强制解锁', '', async () => {
            const targetWindow = openTerminalTarget();
            if (!targetWindow) {
              toast('浏览器阻止了新终端标签页，请允许此站点打开新标签页后重试。', true);
              return;
            }
            const opened = await tryOpenSession(session.id, targetWindow);
            if (opened) toast('检测到终端未被占用，已进入终端');
          }),
          button('重置', '', async () => {
            let lockInfo;
            try {
              lockInfo = await api(`/api/sessions/${session.id}/lock`);
            } catch (error) {
              toast(`锁状态校验失败：${error.message}`, true);
              return;
            }
            if (lockInfo.locked) {
              showForceUnlock(session.id, null, lockInfo);
              return;
            }
            if (!confirm(`确定清空“${session.name}”吗？其中正在运行的程序也会终止。`)) return;
            const targetWindow = openTerminalTarget();
            if (!targetWindow) {
              toast('浏览器阻止了新终端标签页，请允许此站点打开新标签页后重试。', true);
              return;
            }
            try {
              await api(`/api/sessions/${session.id}/reset`, { method: 'POST', body: '{}' });
              await tryOpenSession(session.id, targetWindow);
              toast('终端已重置');
              await refresh();
            } catch (error) {
              closeTarget(targetWindow);
              if (error.status === 409) showForceUnlock(session.id, undefined, error.body || {});
              else toast(error.message, true);
            }
          }),
          button('删除', 'danger', async () => {
            if (!confirm(`确定删除“${session.name}”吗？此操作会终止其中的程序。`)) return;
            try {
              await api(`/api/sessions/${session.id}`, { method: 'DELETE' });
              toast('终端已删除');
              await refresh();
            } catch (error) { toast(error.message, true); }
          })
        );
        card.append(info, actions);
        sessionsEl.append(card);
      }
    }

    let refreshRequest = null;

    function refresh() {
      if (refreshRequest) return refreshRequest;
      refreshRequest = (async () => {
        try {
          const data = await api('/api/sessions');
          sessions = data.sessions;
          render();
          document.getElementById('lastRefresh').textContent = `更新于 ${new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit', second: '2-digit' })}`;
        } catch (error) {
          document.getElementById('lastRefresh').textContent = '连接失败';
          toast(error.message, true);
        }
      })().finally(() => {
        refreshRequest = null;
      });
      return refreshRequest;
    }

    document.getElementById('newSession').addEventListener('click', async () => {
      const targetWindow = openTerminalTarget();
      if (!targetWindow) {
        toast('浏览器阻止了新终端标签页，请允许此站点打开新标签页后重试。', true);
        return;
      }
      try {
        const session = await api('/api/sessions', { method: 'POST', body: '{}' });
        await tryOpenSession(session.id, targetWindow);
        toast('已创建独立终端');
        await refresh();
      } catch (error) {
        closeTarget(targetWindow);
        toast(error.message, true);
      }
    });

    document.getElementById('forceUnlockCancel').addEventListener('click', () => {
      if (pendingOpen) closeTarget(pendingOpen.targetWindow);
      hideForceUnlock();
    });

    document.getElementById('forceUnlockConfirm').addEventListener('click', async () => {
      if (!pendingOpen) return;
      const secretInput = document.getElementById('forceUnlockSecret');
      const secret = secretInput.value;
      if (!secret) {
        toast('请输入强制解锁密文', true);
        secretInput.focus();
        return;
      }

      const request = pendingOpen;
      let targetWindow = request.targetWindow;
      if (!targetWindow || targetWindow.closed) {
        targetWindow = openTerminalTarget();
        if (!targetWindow) {
          toast('浏览器阻止了新终端标签页，请允许此站点打开新标签页后重试。', true);
          return;
        }
      }
      const confirmButton = document.getElementById('forceUnlockConfirm');
      confirmButton.disabled = true;
      try {
        await api(`/api/sessions/${request.id}/force-unlock`, {
          method: 'POST',
          body: JSON.stringify({ secret })
        });
        hideForceUnlock();
        const opened = await tryOpenSession(request.id, targetWindow);
        if (opened) toast('已强制释放旧连接并进入终端');
      } catch (error) {
        closeTarget(targetWindow);
        toast(`强制解锁失败：${error.message}`, true);
      } finally {
        confirmButton.disabled = false;
      }
    });

    document.getElementById('forceUnlockSecret').addEventListener('keydown', (event) => {
      if (event.key === 'Enter') document.getElementById('forceUnlockConfirm').click();
    });

    document.getElementById('forceUnlockMask').addEventListener('click', (event) => {
      if (event.target === event.currentTarget) document.getElementById('forceUnlockCancel').click();
    });

    refresh();
  </script>
</body>
</html>
